<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consonants Master Hub</title>
    <style>
        :root { --primary: #6c5ce7; --bg: #f0f3f7; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; overflow: hidden; }
        
        /* AUTH OVERLAY */
        #auth-overlay { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .google-btn { background: white; color: #2d3436; border: 1px solid #dfe6e9; padding: 1rem 2rem; border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: bold; box-shadow: 0 8px 15px rgba(0,0,0,0.05); }

        /* DASHBOARD */
        #dashboard { display: none; height: 100vh; padding: 40px 20px; box-sizing: border-box; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 40px auto; }
        .card { background: white; padding: 30px; border-radius: 20px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(108, 92, 231, 0.2); }
        .card h3 { color: var(--primary); margin: 15px 0 5px; }

        /* MODAL IFRAME (Phòng riêng cho mỗi bài tập) */
        #game-modal { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 500; }
        iframe { width: 100%; height: 100%; border: none; }
        .back-btn { position: fixed; bottom: 20px; left: 20px; background: #2d3436; color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; z-index: 600; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <h2>ENGLISH CONSONANTS HUB</h2>
    <p>Đăng nhập để bắt đầu học tập</p>
    <button id="login-btn" class="google-btn">Tiếp tục với Google</button>
    <p id="login-msg" style="color: red; margin-top: 10px;"></p>
</div>

<div id="dashboard">
    <h1 style="color: var(--primary);">MENU CHÍNH</h1>
    <div class="menu-grid">
        <div class="card" onclick="runGame(1)"><h3>📢 Luyện Tập Tự Do</h3></div>
        <div class="card" onclick="runGame(2)"><h3>⚖️ Phân Biệt Cặp Âm</h3></div>
        <div class="card" onclick="runGame(3)"><h3>🏆 Phá Mã Phụ Âm</h3></div>
        <div class="card" onclick="runGame(4)"><h3>📚 Minimal Pairs</h3></div>
    </div>
    <button onclick="logout()">Đăng xuất</button>
</div>

<div id="game-modal">
    <button class="back-btn" onclick="closeGame()">🏠 Trang chủ</button>
    <iframe id="game-frame"></iframe>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCdlTVHwiLOGMnrFe12DE1dQSEHZaJ594I",
        authDomain: "nguyen-am-tieng-anh.firebaseapp.com",
        projectId: "nguyen-am-tieng-anh"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const q = query(collection(db, "Tienganh_so_cap"), where("email", "==", user.email));
            const snap = await getDocs(q);
            if (!snap.empty) {
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
            } else {
                document.getElementById("login-msg").innerText = "Email không có quyền!";
                await signOut(auth);
            }
        }
    });

    document.getElementById("login-btn").onclick = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    // CHỨA NGUYÊN VĂN CODE GỐC CỦA THỦY (KHÔNG SỬA DESIGN)
    const games = {
        1: `<html><head><style>/* CSS TỰ DO */</style></head><body>...Code bài 1...</body></html>`,
        2: `<html><head>...Code bài 2...</head></html>`, // Dán toàn bộ code bài Phân biệt cặp âm vào đây
        3: `<html><head>...Code bài 3...</head></html>`, // Dán toàn bộ code bài Phá mã Champion vào đây
        4: `<html><head>...Code bài 4...</head></html>`  // Dán toàn bộ code bài Minimal Pairs vào đây
    };

    window.runGame = (id) => {
        const frame = document.getElementById('game-frame');
        document.getElementById('game-modal').style.display = 'block';
        const doc = frame.contentWindow.document;
        doc.open();
        doc.write(games[id]); // Xuất code gốc vào Iframe
        doc.close();
    };

    window.closeGame = () => {
        document.getElementById('game-modal').style.display = 'none';
        document.getElementById('game-frame').src = "about:blank";
    };
</script>
</body>
</html>
