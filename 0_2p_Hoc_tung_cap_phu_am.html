<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Consonants Mastery</title>
    <style>
        :root {
            --primary: #00cec9;
            --secondary: #6c5ce7;
            --bg: #f0f3f7;
            --card-bg: #ffffff;
            --text: #2d3436;
            --border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            background: var(--card-bg);
            width: 95%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        h2 { 
            color: var(--secondary); 
            font-size: 1.8rem; 
            margin: 0 0 8px 0;
            font-weight: 600; /* Giảm độ đậm */
        }

        .subtitle {
            font-size: 1rem;
            color: #636e72;
            margin-bottom: 25px;
            display: block;
        }

        /* Menu Grid Layout */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .menu-btn {
            background: white;
            border: 1.5px solid var(--border);
            padding: 18px 10px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 500; /* Chữ nhẹ nhàng hơn */
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f0fdfc;
            transform: translateY(-2px);
        }

        /* Practice Area - Thẻ tích hợp âm thanh và chữ */
        .practice-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }

        /* Tự động chia 2 hoặc 3 cột tùy số lượng âm */
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }

        .ipa-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .ipa-card:hover {
            border-color: var(--secondary);
            background: #f8faff;
        }

        .ipa-text {
            font-size: 2.2rem; /* To nhưng thanh thoát */
            font-weight: 500; /* Giảm độ đậm từ 800 xuống 500 */
            margin: 0;
            color: var(--text);
        }

        .speaker-icon {
            color: #b2bec3;
            transition: 0.2s;
        }

        .ipa-card:hover .speaker-icon {
            color: var(--secondary);
            transform: scale(1.1);
        }

        /* Navigation */
        .header-nav {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 15px;
        }

        .icon-home {
            background: #f1f5f9;
            border: none;
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-home:hover { background: #e2e8f0; }

        .btn-finish {
            width: 100%;
            padding: 16px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-finish:hover { opacity: 0.9; }

        .logout-link {
            display: block;
            margin-top: 20px;
            color: #b2bec3;
            text-decoration: none;
            font-size: 0.85rem;
        }

        /* Auth UI */
        .google-login {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: 1.5px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .google-login:hover { border-color: var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. ĐĂNG NHẬP -->
    <div id="login-screen">
        <h2>Chào mừng</h2>
        <span class="subtitle">Đăng nhập để luyện tập phụ âm</span>
        <button id="login-btn" class="google-login">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59L2.56 13.22C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
            Tiếp tục với Google
        </button>
        <p id="login-msg" style="color: red; margin-top: 10px; font-size: 0.9rem;"></p>
    </div>

    <!-- 2. TRANG CHỦ -->
    <div id="home-screen" style="display: none;">
        <h2>Luyện Phụ Âm</h2>
        <span class="subtitle">Chọn cặp âm để bắt đầu</span>
        <div id="menu-grid" class="menu-grid"></div>
        <a href="#" class="logout-link" onclick="logout()">Đăng xuất</a>
    </div>

    <!-- 3. TRANG THÀNH PHẦN -->
    <div id="main-content" style="display: none;">
        <div class="header-nav">
            <button class="icon-home" onclick="goHome()">🏠</button>
        </div>
        <h2 id="lesson-title">Luyện tập</h2>
        <span class="subtitle">Bấm vào thẻ để nghe phát âm</span>
        
        <div id="practice-grid" class="practice-grid"></div>

        <button class="btn-finish" onclick="goHome()">Xong bài tập</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCdlTVHwiLOGMnrFe12DE1dQSEHZaJ594I",
        authDomain: "nguyen-am-tieng-anh.firebaseapp.com",
        projectId: "nguyen-am-tieng-anh"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.data = [
        { label: "p & b", pair: [{id: 'p', t: '/p/'}, {id: 'b', t: '/b/'}] },
        { label: "t & d", pair: [{id: 't', t: '/t/'}, {id: 'd', t: '/d/'}] },
        { label: "k & g", pair: [{id: 'k', t: '/k/'}, {id: 'g', t: '/g/'}] },
        { label: "f & v", pair: [{id: 'f', t: '/f/'}, {id: 'v', t: '/v/'}] },
        { label: "θ & ð", pair: [{id: 'th1', t: '/θ/'}, {id: 'th2', t: '/ð/'}] },
        { label: "s & z", pair: [{id: 's', t: '/s/'}, {id: 'z', t: '/z/'}] },
        { label: "ʃ & ʒ", pair: [{id: 'sh', t: '/ʃ/'}, {id: 'ge', t: '/ʒ/'}] },
        { label: "tʃ & dʒ", pair: [{id: 'ch', t: '/tʃ/'}, {id: 'j', t: '/dʒ/'}] },
        { label: "m - n - ŋ", pair: [{id: 'm', t: '/m/'}, {id: 'n', t: '/n/'}, {id: 'ng', t: '/ŋ/'}] },
        { label: "l & r", pair: [{id: 'l', t: '/l/'}, {id: 'r', t: '/r/'}] },
        { label: "w & j", pair: [{id: 'w', t: '/w/'}, {id: 'y', t: '/j/'}] },
        { label: "h", pair: [{id: 'h', t: '/h/'}] }
    ];

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const q = query(collection(db, "Tienganh_so_cap"), where("email", "==", user.email));
            const snap = await getDocs(q);
            if (!snap.empty) {
                document.getElementById("login-screen").style.display = "none";
                showHomeScreen();
            } else {
                document.getElementById("login-msg").innerText = "Email không có quyền.";
                await signOut(auth);
            }
        } else {
            document.getElementById("login-screen").style.display = "block";
            document.getElementById("home-screen").style.display = "none";
            document.getElementById("main-content").style.display = "none";
        }
    });

    document.getElementById("login-btn").onclick = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth);

    function showHomeScreen() {
        document.getElementById("home-screen").style.display = "block";
        document.getElementById("main-content").style.display = "none";
        const grid = document.getElementById("menu-grid");
        grid.innerHTML = '';
        window.data.forEach((item, index) => {
            const btn = document.createElement("button");
            btn.className = "menu-btn";
            btn.innerText = item.label;
            btn.onclick = () => startLesson(index);
            grid.appendChild(btn);
        });
    }

    window.goHome = () => showHomeScreen();

    function startLesson(idx) {
        const lesson = window.data[idx];
        document.getElementById("home-screen").style.display = "none";
        document.getElementById("main-content").style.display = "block";
        document.getElementById("lesson-title").innerText = lesson.label;

        const grid = document.getElementById("practice-grid");
        grid.className = `practice-grid grid-${lesson.pair.length}`;
        grid.innerHTML = '';

        lesson.pair.forEach((item) => {
            const card = document.createElement("div");
            card.className = "ipa-card";
            card.innerHTML = `
                <svg class="speaker-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.01,19.86 21,16.28 21,12C21,7.72 18.01,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
                </svg>
                <p class="ipa-text">${item.t}</p>
            `;
            card.onclick = () => new Audio(`${item.id}.mp3`).play();
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
