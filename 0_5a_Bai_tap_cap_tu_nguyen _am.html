<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel Minimal Pairs Mastery</title>
    <style>
        :root {
            --primary: #00b894;
            --primary-dark: #00947a;
            --secondary: #6c5ce7;
            --bg: #f0f3f7;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .app-container {
            background: var(--card-bg);
            width: 95%;
            max-width: 500px;
            padding: 40px;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }

        h1 { color: var(--secondary); font-size: 2.2rem; margin: 0 0 10px; font-weight: 800; }
        .subtitle { color: var(--text-sub); font-size: 1.1rem; margin-bottom: 35px; display: block; font-weight: 500; }

        /* Menu Grid 3D Xanh lá */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .menu-item {
            background: var(--primary);
            border: none;
            padding: 20px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: all 0.1s ease;
        }

        .menu-item:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--primary-dark); background: #00c9a1; }
        .menu-item:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }

        /* Sound Card: Tích hợp Loa + Từ + IPA */
        .sound-grid {
            display: grid;
            gap: 20px;
            width: 100%;
        }

        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }

        .sound-card {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 25px;
            padding: 30px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 var(--border);
        }

        .sound-card:hover { border-color: var(--secondary); transform: translateY(-4px); box-shadow: 0 12px 0 var(--border); }
        .sound-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--border); }

        .word-text { font-size: 2.2rem; font-weight: 700; margin: 5px 0 0 0; color: var(--text-main); }
        .ipa-text { font-size: 1.1rem; color: var(--secondary); font-weight: 600; margin: 0; }

        /* Điều hướng */
        .action-btn {
            width: 100%; padding: 18px; background: var(--secondary); color: white; border: none;
            border-radius: 50px; font-size: 1.2rem; font-weight: 700; margin-top: 35px; cursor: pointer;
            box-shadow: 0 6px 0 #5649c0;
        }

        .home-icon-btn {
            position: absolute; top: 25px; left: 25px; background: #dfe6e9; border: none;
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .logout-btn { margin-top: 30px; background: #fab1a0; color: #d63031; border: none; padding: 10px 25px; border-radius: 50px; font-weight: 700; cursor: pointer; }

        /* Auth */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .google-auth-btn { width: 80%; max-width: 300px; padding: 15px; border-radius: 50px; border: 2px solid var(--border); background: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1>VOWEL PAIRS</h1>
    <button id="login-trigger" class="google-auth-btn">Tiếp tục với Google</button>
    <p id="auth-err" style="color: red; margin-top: 15px; font-weight: bold;"></p>
</div>

<div class="app-container" id="main-game" style="display: none;">
    <button id="back-nav" class="home-icon-btn" onclick="goHome()" style="display: none;">🏠</button>

    <div id="home-section">
        <h1>MINIMAL PAIRS</h1>
        <span class="subtitle">Phân biệt nguyên âm qua cặp từ</span>
        <div id="lesson-menu" class="menu-grid"></div>
        <button class="logout-btn" onclick="logout()">ĐĂNG XUẤT</button>
    </div>

    <div id="practice-section" style="display: none;">
        <h1 id="lesson-header" style="font-size: 1.8rem;">LUYỆN TẬP</h1>
        <span class="subtitle">Chạm vào thẻ để nghe phát âm từ</span>
        <div id="sound-display" class="sound-grid"></div>
        <button class="action-btn" onclick="goHome()">XONG BÀI TẬP</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCdlTVHwiLOGMnrFe12DE1dQSEHZaJ594I",
        authDomain: "nguyen-am-tieng-anh.firebaseapp.com",
        projectId: "nguyen-am-tieng-anh"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Dữ liệu Cặp từ tối thiểu (Minimal Pairs)
    // Audio sẽ gọi theo tên từ: ship.mp3, sheep.mp3...
    window.lessonData = [
        { name: "/ɪ/ vs /i:/", items: [{id: 'ship', sym: '/ʃɪp/'}, {id: 'sheep', sym: '/ʃiːp/'}] },
        { name: "/e/ vs /æ/", items: [{id: 'pen', sym: '/pen/'}, {id: 'pan', sym: '/pæn/'}] },
        { name: "/ə/ vs /ɜ:/", items: [{id: 'ago', sym: '/əˈɡəʊ/'}, {id: 'bird', sym: '/bɜːrd/'}] },
        { name: "/ʊ/ vs /u:/", items: [{id: 'foot', sym: '/fʊt/'}, {id: 'food', sym: '/fuːt/'}] },
        { name: "/ɒ/ vs /ɔ:/", items: [{id: 'pot', sym: '/pɒt/'}, {id: 'port', sym: '/pɔːt/'}] },
        { name: "/ʌ/ vs /ɑ:/", items: [{id: 'cup', sym: '/kʌp/'}, {id: 'carp', sym: '/kɑːp/'}] },
        { name: "Nhóm /ɪə - eə - ʊə/", items: [{id: 'near', sym: '/nɪə/'}, {id: 'hair', sym: '/heə/'}, {id: 'pure', sym: '/pjʊə/'}] },
        { name: "Nhóm /aɪ - eɪ - ɔɪ/", items: [{id: 'my', sym: '/maɪ/'}, {id: 'may', sym: '/meɪ/'}, {id: 'boy', sym: '/ɔɪ/'}] },
        { name: "/aʊ/ vs /oʊ/", items: [{id: 'cow', sym: '/kaʊ/'}, {id: 'go', sym: '/ɡəʊ/'}] }
    ];

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const q = query(collection(db, "Tienganh_so_cap"), where("email", "==", user.email));
            const snap = await getDocs(q);
            if (!snap.empty) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-game").style.display = "block";
                loadDashboard();
            } else {
                document.getElementById("auth-err").innerText = "Email không được phép.";
                await signOut(auth);
            }
        } else {
            document.getElementById("login-screen").style.display = "flex";
            document.getElementById("main-game").style.display = "none";
        }
    });

    document.getElementById("login-trigger").onclick = () => signInWithPopup(auth, provider);
    window.logout = () => signOut(auth).then(() => location.reload());

    function loadDashboard() {
        document.getElementById("home-section").style.display = "block";
        document.getElementById("practice-section").style.display = "none";
        document.getElementById("back-nav").style.display = "none";
        const grid = document.getElementById("lesson-menu");
        grid.innerHTML = '';
        window.lessonData.forEach((lesson, index) => {
            const btn = document.createElement("div");
            btn.className = "menu-item";
            btn.innerText = lesson.name;
            btn.onclick = () => openLesson(index);
            grid.appendChild(btn);
        });
    }

    window.goHome = () => loadDashboard();

    function openLesson(idx) {
        const lesson = window.lessonData[idx];
        document.getElementById("home-section").style.display = "none";
        document.getElementById("practice-section").style.display = "block";
        document.getElementById("back-nav").style.display = "flex";
        document.getElementById("lesson-header").innerText = lesson.name;

        const grid = document.getElementById("sound-display");
        grid.className = `sound-grid grid-${lesson.items.length}`;
        grid.innerHTML = '';

        lesson.items.forEach((item) => {
            const card = document.createElement("div");
            card.className = "sound-card";
            // Chữ cái đầu viết hoa cho từ
            const capitalizedWord = item.id.charAt(0).toUpperCase() + item.id.slice(1);
            card.innerHTML = `
                <svg width="30" height="30" viewBox="0 0 24 24" fill="#6c5ce7">
                    <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.01,19.86 21,16.28 21,12C21,7.72 18.01,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
                </svg>
                <p class="word-text">${capitalizedWord}</p>
                <p class="ipa-text">${item.sym}</p>
            `;
            card.onclick = () => new Audio(`${item.id}.mp3`).play();
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
